<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeDepth Terminal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230B0E13'/><g fill='%2335C9C4' transform='translate(3 18) scale(.19)'><path d='M58 14H138L126 40H46Z'/><path d='M20 53H154L142 79H8Z'/><path d='M49 92H129L117 118H37Z'/><path d='M151 14H208C250 14 280 36 280 66C280 96 250 118 208 118H126L138 92H207C233 92 250 82 250 66C250 50 233 40 207 40H139Z'/></g></svg>">
    <meta name="theme-color" content="#0B0E13">
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1e;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #35C9C4;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11px;
            background: rgba(10,14,18,0.85);
            border: 1px solid rgba(150,168,184,0.13);
            padding: 7px 11px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Initializing...</div>

<script type='text/javascript'>
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
        (e.metaKey && e.altKey && e.keyCode === 73)) {
            e.stopPropagation();
            return true;
        }
    }, true);

    var Module = {
        locateFile: function(path) {
            return '/' + path;
        },
        preRun: [],
        postRun: [],
        print: function(text) {
            console.log(text);
        },
        printErr: function(text) {
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('WebGL context lost. Please reload.');
                e.preventDefault();
            }, false);
            return canvas;
        })(),
        setStatus: function(text) {
            var statusDiv = document.getElementById('status');
            if (!statusDiv) return;
            // Hide once the app is actually running - the runtime emits
            // 'Running...' after onRuntimeInitialized, so without this the
            // badge lingers over the terminal forever.
            if (!text || /Running/.test(text)) {
                statusDiv.style.display = 'none';
                return;
            }
            statusDiv.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            Module.setStatus(left ? 'Preparing (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Ready');
        }
    };
    Module.setStatus('Downloading');
    document.getElementById('canvas').addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

{{{ SCRIPT }}}

<script type='text/javascript'>
    Module.onRuntimeInitialized = function() {
        var canvas = Module.canvas;
        window.addEventListener('resize', function() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
        });
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        var statusDiv = document.getElementById('status');
        if (statusDiv) {
            statusDiv.textContent = 'Ready';
            setTimeout(function() {
                statusDiv.style.display = 'none';
            }, 2000);
        }
    };
</script>
</body>
</html>
