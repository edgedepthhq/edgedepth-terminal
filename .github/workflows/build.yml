name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: |
          mkdir build && cd build
          emcmake cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: cd build && emmake make -j$(nproc) c_based_trader_client

      - name: Verify artifacts
        # Four artifacts, not three. index.data holds the fonts preloaded via
        # --preload-file in CMakeLists.txt; the app renders no text without it.
        run: ls -la build/index.wasm build/index.js build/index.html build/index.data
