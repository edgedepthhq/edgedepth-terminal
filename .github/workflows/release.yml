name: release

# Publishes the container image so `docker compose up` pulls in seconds
# instead of making every visitor download the Emscripten toolchain and
# compile C++20 to WebAssembly on first run.

on:
  push:
    branches: [master]
    tags: ["v*"]
    # Documentation-only commits do not change the image. Without this,
    # every README or ARCHITECTURE edit rebuilds the toolchain and gives
    # :latest a new digest for identical source. Use workflow_dispatch if
    # a release ever needs publishing from a docs-only commit.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arch WITHOUT emulating the compiler. The Emscripten stage is
          # pinned to $BUILDPLATFORM in the Dockerfile, so C++20 to WebAssembly
          # runs once natively on the amd64 runner and its output, which is
          # architecture independent, gets copied into a per-arch nginx layer.
          # Only that thin runtime layer is built twice.
          #
          # Worth the second layer: without it Apple Silicon pulls an amd64
          # image, prints a platform-mismatch warning and runs nginx emulated.
          # It works, but it is a poor first impression for a quick start that
          # advertises "starts in seconds".
          platforms: linux/amd64,linux/arm64
          # No GitHub Actions cache here, deliberately. mode=max exports every
          # intermediate layer, and this image is built on emsdk: several GB
          # against a 10GB per-repo cache limit. That export failed with
          # "error writing layer blob: not_found" and took the whole release
          # down with it, while the much smaller gateway image cached fine.
          # A slower release is a fair trade for one that finishes. If build
          # time becomes a problem, use a registry cache instead of the
          # Actions cache: type=registry,ref=...:buildcache has no size cap.
