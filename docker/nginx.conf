server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client is compiled with -pthread (see CMakeLists.txt), so it needs
    # SharedArrayBuffer, which browsers only expose to a cross-origin isolated
    # page. Without BOTH of these headers the module dies at boot with
    # "WebAssembly.Memory cannot be serialized". This is not optional.
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Artifact filenames are not content hashed (index.wasm is always
    # index.wasm), so an immutable cache rule would pin users to a stale
    # build forever. Revalidate every load; ETag makes that cheap. This
    # mirrors how production serves /terminal-app/.
    add_header Cache-Control "max-age=0, must-revalidate" always;

    # nginx 1.27's mime.types already maps .wasm to application/wasm, which
    # matters because a wrong Content-Type silently disables streaming
    # compilation. Redeclaring it here only produces a duplicate-extension
    # warning at start. index.data has no registered type and falls through
    # to default_type, which is what Emscripten's loader expects.
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always gzipped and listing it here only warns at start.
    gzip_types application/wasm application/javascript application/octet-stream;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
