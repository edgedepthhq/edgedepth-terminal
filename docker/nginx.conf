server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client is compiled with -pthread (see CMakeLists.txt), so it needs
    # SharedArrayBuffer, which browsers only expose to a cross-origin isolated
    # page. Without BOTH of these headers the module dies at boot with
    # "WebAssembly.Memory cannot be serialized". This is not optional.
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Artifact filenames are not content hashed (index.wasm is always
    # index.wasm), so an immutable cache rule would pin users to a stale
    # build forever. Revalidate every load; ETag makes that cheap. This
    # mirrors how production serves /terminal-app/.
    add_header Cache-Control "max-age=0, must-revalidate" always;

    # nginx 1.27's mime.types already maps .wasm to application/wasm, which
    # matters because a wrong Content-Type silently disables streaming
    # compilation. Redeclaring it here only produces a duplicate-extension
    # warning at start. index.data has no registered type and falls through
    # to default_type, which is what Emscripten's loader expects.
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always gzipped and listing it here only warns at start.
    gzip_types application/wasm application/javascript application/octet-stream;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # The client IS router-based, on exactly one route prefix. It pushState's
    # /terminal/<symbol> a few seconds after boot, navigates there on a
    # watchlist click, and listens for popstate. Without a server-side
    # counterpart, clicking any symbol, pressing F5 and opening a shared link
    # all land on a bare nginx 404.
    #
    # Scoped on purpose. A blanket `try_files $uri /index.html` would break the
    # page it is trying to fix: shell.html loads index.js, coi-serviceworker.js
    # and edgedepth-config.js with DOCUMENT-RELATIVE srcs, so from
    # /terminal/btcusdt the browser asks for /terminal/index.js, gets HTML with
    # a 200, and reports "Unexpected token '<'". Worse, the config script is
    # where __EDGEDEPTH_WS_URL__ lives, so the terminal would silently fall
    # back to the hosted feed instead of the gateway beside it. index.wasm and
    # index.data are unaffected either way: Module.locateFile already returns
    # root-absolute paths.
    #
    # Any other path under /terminal/ returns the app rather than a 404. That
    # is the accepted cost of the prefix; only the three scripts below are ever
    # requested from that directory.
    location ^~ /terminal/ {
        location ~ ^/terminal/(index\.js|edgedepth-config\.js|coi-serviceworker\.js)$ {
            try_files /$1 =404;
        }
        try_files /index.html =404;
    }

    location / {
        # No SPA fallback here, and that is deliberate: outside /terminal/ a
        # missing asset should look missing. Returning HTML with a 200 makes
        # the browser parse markup as JavaScript and report "Unexpected token
        # '<'" instead of a plain 404.
        try_files $uri $uri/ =404;
    }
}
